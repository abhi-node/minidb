<svg xmlns="http://www.w3.org/2000/svg" width="860" height="472" viewBox="0 0 860 472" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect width="860" height="472" fill="#fcfcfb"/><text x="20" y="28" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="15">The database file is an array of 4 KB pages</text><rect x="20" y="46" width="122" height="36" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="81.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">0  file header</text><rect x="148" y="46" width="122" height="36" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="209.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">1  catalog root</text><rect x="276" y="46" width="122" height="36" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="337.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">2  leaf</text><rect x="404" y="46" width="122" height="36" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="465.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">3  leaf</text><rect x="532" y="46" width="122" height="36" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="593.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">4  internal</text><rect x="660" y="46" width="122" height="36" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="721.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">5  leaf</text><rect x="788" y="46" width="60" height="36" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="818.0" y="68.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">…</text><text x="20" y="100" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">page count and free-list head live in page 0; every table is a B+-tree whose root page never moves</text><text x="20" y="142" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">A leaf page</text><rect x="20" y="150" width="120" height="56" rx="0" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="80.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">header</text><text x="80.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">12 bytes</text><rect x="140" y="150" width="150" height="56" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="215.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">slot array →</text><text x="215.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">2 bytes per cell, sorted</text><rect x="290" y="150" width="250" height="56" rx="0" fill="#fcfcfb" stroke="#8a8983" stroke-width="1.2"/><text x="415.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">free space</text><text x="415.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">grows from both ends</text><rect x="540" y="150" width="100" height="56" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="590.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">cell</text><text x="590.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">key 30</text><rect x="640" y="150" width="100" height="56" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="690.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">cell</text><text x="690.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">key 10</text><rect x="740" y="150" width="100" height="56" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="790.0" y="174.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">cell</text><text x="790.0" y="190.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">key 20</text><path d="M170,206 C170,256 690,256 690,210" fill="none" stroke="#1baf7a" stroke-width="1.3" marker-end="url(#arrowhead)"/><path d="M215,206 C215,256 790,256 790,210" fill="none" stroke="#1baf7a" stroke-width="1.3" marker-end="url(#arrowhead)"/><path d="M260,206 C260,256 590,256 590,210" fill="none" stroke="#1baf7a" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="20" y="272" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">Slots are sorted by key and point at the cells, which stay where they landed: an insert moves 2-byte slots, not rows.</text><text x="20" y="312" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">A cell</text><rect x="20" y="320" width="130" height="50" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="85.0" y="341.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">key</text><text x="85.0" y="357.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">8 bytes</text><rect x="150" y="320" width="110" height="50" rx="0" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="205.0" y="341.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">row length</text><text x="205.0" y="357.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">2 bytes</text><rect x="260" y="320" width="580" height="50" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="550.0" y="341.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">row</text><text x="550.0" y="357.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">column values back to back, no padding</text><text x="20" y="408" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">The row</text><text x="84" y="408" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">(7, &#x27;Ada&#x27;, 36.5, TRUE)</text><rect x="260" y="390" width="190" height="26" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="355.0" y="407.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">INT</text><text x="355.0" y="434" text-anchor="middle" font-weight="400" fill="#52514e" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">07 00 00 00 00 00 00 00</text><rect x="450" y="390" width="60" height="26" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="480.0" y="407.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">length</text><text x="480.0" y="434" text-anchor="middle" font-weight="400" fill="#52514e" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">03 00</text><rect x="510" y="390" width="80" height="26" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="550.0" y="407.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">TEXT</text><text x="550.0" y="434" text-anchor="middle" font-weight="400" fill="#52514e" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">41 64 61</text><rect x="590" y="390" width="190" height="26" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="685.0" y="407.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">DECIMAL</text><text x="685.0" y="434" text-anchor="middle" font-weight="400" fill="#52514e" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">00 00 00 00 00 40 42 40</text><rect x="780" y="390" width="60" height="26" rx="0" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="810.0" y="407.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">BOOL</text><text x="810.0" y="434" text-anchor="middle" font-weight="400" fill="#52514e" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">01</text><text x="840" y="458" text-anchor="end" font-weight="400" fill="#52514e" font-size="12">22 bytes; TEXT is read in place, never copied</text></svg>