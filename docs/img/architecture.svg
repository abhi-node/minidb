<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect width="860" height="470" fill="#fcfcfb"/><text x="20" y="28" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="15">One statement, top to bottom</text><text x="20" y="83" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">SQL front end</text><text x="20" y="193" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">Query execution</text><text x="20" y="303" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">Storage engine</text><text x="20" y="413" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">Files on disk</text><rect x="150" y="52" width="150" height="52" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="225.0" y="74.5" text-anchor="middle" font-weight="400" fill="#0b0b0b" font-size="13">SQL text</text><text x="225.0" y="90.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">SELECT ... WHERE id = 7</text><rect x="340" y="52" width="130" height="52" rx="6" fill="#dbe9fb" stroke="#2a78d6" stroke-width="1.2"/><text x="405.0" y="74.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Tokenizer</text><text x="405.0" y="90.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">text → tokens</text><rect x="510" y="52" width="130" height="52" rx="6" fill="#dbe9fb" stroke="#2a78d6" stroke-width="1.2"/><text x="575.0" y="74.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Parser</text><text x="575.0" y="90.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">recursive descent</text><rect x="680" y="52" width="150" height="52" rx="6" fill="#dbe9fb" stroke="#2a78d6" stroke-width="1.2"/><text x="755.0" y="74.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">AST</text><text x="755.0" y="90.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">arena-allocated</text><line x1="300" y1="78" x2="338" y2="78" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="470" y1="78" x2="508" y2="78" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="640" y1="78" x2="678" y2="78" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><rect x="150" y="162" width="190" height="52" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="245.0" y="184.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Binder</text><text x="245.0" y="200.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">resolve names, check types</text><rect x="395" y="162" width="190" height="52" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="490.0" y="184.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Planner</text><text x="490.0" y="200.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">key ranges, join method</text><rect x="640" y="162" width="190" height="52" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="735.0" y="184.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Volcano operators</text><text x="735.0" y="200.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">open / next / close</text><line x1="755" y1="104" x2="755" y2="132" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="755" y1="132" x2="245" y2="132" stroke="#8a8983" stroke-width="1.2"/><line x1="245" y1="132" x2="245" y2="160" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="340" y1="188" x2="393" y2="188" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="585" y1="188" x2="638" y2="188" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><rect x="150" y="272" width="190" height="52" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="245.0" y="294.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">B+-tree</text><text x="245.0" y="310.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">one per table: key → row</text><rect x="395" y="272" width="190" height="52" rx="6" fill="#fae3ec" stroke="#e87ba4" stroke-width="1.2"/><text x="490.0" y="294.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Pager</text><text x="490.0" y="310.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">4 KB page cache, no-steal</text><rect x="640" y="272" width="190" height="52" rx="6" fill="#fbeccb" stroke="#eda100" stroke-width="1.2"/><text x="735.0" y="294.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Write-ahead log</text><text x="735.0" y="310.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">group commit, checksums</text><line x1="700" y1="214" x2="300" y2="270" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="340.0" y="238.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">read / change rows</text><line x1="340" y1="298" x2="393" y2="298" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="348.5" y="290.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">pages</text><line x1="790" y1="214" x2="790" y2="270" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="690.0" y="246.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">log each change</text><rect x="395" y="382" width="190" height="52" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="490.0" y="404.5" text-anchor="middle" font-weight="400" fill="#0b0b0b" font-size="13">shop.db</text><text x="490.0" y="420.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">B+-tree pages</text><rect x="640" y="382" width="190" height="52" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="735.0" y="404.5" text-anchor="middle" font-weight="400" fill="#0b0b0b" font-size="13">shop.db.wal</text><text x="735.0" y="420.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">records since last checkpoint</text><line x1="490" y1="324" x2="490" y2="380" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="390.0" y="356.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">checkpoint only</text><line x1="735" y1="324" x2="735" y2="380" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="743.0" y="356.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">every commit</text><line x1="640" y1="316" x2="587" y2="316" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/><text x="613" y="344" text-anchor="middle" font-weight="400" fill="#52514e" font-size="11.5">page images</text></svg>