<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect width="860" height="400" fill="#fcfcfb"/><text x="20" y="28" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="15">Checkpoint: pages are logged before the file is overwritten</text><rect x="20" y="56" width="175" height="70" rx="6" fill="#fae3ec" stroke="#e87ba4" stroke-width="1.2"/><text x="107.5" y="87.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Dirty pages</text><text x="107.5" y="103.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">in the cache only</text><rect x="235" y="56" width="175" height="70" rx="6" fill="#fbeccb" stroke="#eda100" stroke-width="1.2"/><text x="322.5" y="79.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">1. Log page images</text><text x="322.5" y="95.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">append to WAL + end marker</text><text x="322.5" y="111.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">fsync the WAL</text><rect x="450" y="56" width="175" height="70" rx="6" fill="#fae3ec" stroke="#e87ba4" stroke-width="1.2"/><text x="537.5" y="79.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">2. Overwrite pages</text><text x="537.5" y="95.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">write into the database file</text><text x="537.5" y="111.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">fsync the file</text><rect x="665" y="56" width="175" height="70" rx="6" fill="#fbeccb" stroke="#eda100" stroke-width="1.2"/><text x="752.5" y="79.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">3. Empty the WAL</text><text x="752.5" y="95.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">truncate to its header</text><text x="752.5" y="111.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">fsync</text><line x1="195" y1="91" x2="233" y2="91" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="410" y1="91" x2="448" y2="91" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="625" y1="91" x2="663" y2="91" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="20" y="170" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">If the process dies…</text><text x="165" y="170" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">recovery at the next open reads the WAL and does exactly one of these:</text><line x1="322" y1="126" x2="322" y2="150" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="322" y1="180" x2="322" y2="194" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="235" y="196" width="175" height="110" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="322.5" y="223.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">…during step 1</text><text x="322.5" y="239.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">No end marker, so the file was</text><text x="322.5" y="255.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">never touched. Ignore the</text><text x="322.5" y="271.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">images; replay the logged</text><text x="322.5" y="287.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">statements onto the old file.</text><line x1="537" y1="126" x2="537" y2="150" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="537" y1="180" x2="537" y2="194" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="450" y="196" width="175" height="110" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="537.5" y="223.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">…during step 2</text><text x="537.5" y="239.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">End marker is durable. Copy</text><text x="537.5" y="255.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">every image into the file</text><text x="537.5" y="271.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">again (idempotent), then</text><text x="537.5" y="287.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">replay anything logged after.</text><line x1="752" y1="126" x2="752" y2="150" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="752" y1="180" x2="752" y2="194" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="665" y="196" width="175" height="110" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="752.5" y="223.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">…during step 3</text><text x="752.5" y="239.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">File is already complete.</text><text x="752.5" y="255.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">Copying the images again</text><text x="752.5" y="271.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">changes nothing; the WAL</text><text x="752.5" y="287.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">is emptied.</text><rect x="20" y="196" width="175" height="110" rx="6" fill="#efeeea" stroke="#8a8983" stroke-width="1.2"/><text x="107.5" y="215.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">…between checkpoints</text><text x="107.5" y="231.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">Replay every committed</text><text x="107.5" y="247.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">statement in the WAL.</text><text x="107.5" y="263.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">A torn or uncommitted</text><text x="107.5" y="279.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">tail fails its checksum</text><text x="107.5" y="295.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">and is dropped.</text><line x1="107" y1="126" x2="107" y2="150" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="107" y1="180" x2="107" y2="194" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 4"/><text x="20" y="344" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">Why the detour through the log?</text><text x="20" y="366" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">Overwriting 4 KB pages in place is not atomic. A crash half-way leaves a mix of old and new pages that replaying</text><text x="20" y="384" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">logical records cannot repair. With the images safely in the WAL first, there is always a complete copy to finish from.</text></svg>