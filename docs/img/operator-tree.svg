<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect width="860" height="430" fill="#fcfcfb"/><text x="20" y="28" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="15">A query is a tree of iterators; rows are pulled from the top</text><text x="20" y="54" text-anchor="start" font-weight="400" fill="#52514e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT u.name, o.total FROM orders o JOIN users u ON u.id = o.user_id</text><text x="20" y="72" text-anchor="start" font-weight="400" fill="#52514e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">WHERE o.total &gt; 10 ORDER BY o.total DESC LIMIT 5</text><rect x="300" y="96" width="250" height="40" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="425.0" y="120.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Limit 5</text><text x="566" y="121" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">stops pulling after five rows</text><rect x="300" y="160" width="250" height="40" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="425.0" y="184.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Project  u.name, o.total</text><text x="566" y="185" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">evaluates the select list</text><rect x="300" y="224" width="250" height="40" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="425.0" y="248.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Sort  o.total DESC</text><text x="566" y="249" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">the only operator that buffers rows</text><rect x="300" y="288" width="250" height="40" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="425.0" y="312.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Filter  o.total &gt; 10</text><text x="566" y="313" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">type-checked at plan time</text><rect x="300" y="352" width="250" height="40" rx="6" fill="#fbe0d5" stroke="#eb6834" stroke-width="1.2"/><text x="425.0" y="376.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">IndexJoin  u.id = o.user_id</text><text x="566" y="377" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">probes users by primary key</text><line x1="395.0" y1="136" x2="395.0" y2="158" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="455.0" y1="160" x2="455.0" y2="138" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/><line x1="395.0" y1="200" x2="395.0" y2="222" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="455.0" y1="224" x2="455.0" y2="202" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/><line x1="395.0" y1="264" x2="395.0" y2="286" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="455.0" y1="288" x2="455.0" y2="266" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/><line x1="395.0" y1="328" x2="395.0" y2="350" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="455.0" y1="352" x2="455.0" y2="330" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/><rect x="60" y="352" width="180" height="40" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="150.0" y="376.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">Scan  orders</text><line x1="298" y1="372" x2="242" y2="372" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="60" y="412" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">walks the leaf chain in key order</text><text x="20" y="120" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">solid arrows: next() calls go down</text><text x="20" y="138" text-anchor="start" font-weight="400" fill="#52514e" font-size="12">dashed arrows: rows come back up</text></svg>