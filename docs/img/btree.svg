<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect width="860" height="330" fill="#fcfcfb"/><text x="20" y="28" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="15">B+-tree: internal pages route, leaves hold the rows</text><rect x="340" y="56" width="180" height="44" rx="6" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.2"/><text x="430.0" y="74.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">40   |   90</text><text x="430.0" y="90.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">root (page id fixed)</text><rect x="40" y="180" width="180" height="44" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="130.0" y="198.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">10  20  30</text><text x="130.0" y="214.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">keys &lt; 40</text><rect x="340" y="180" width="180" height="44" rx="6" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.2"/><text x="430.0" y="198.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">40  57  61  80</text><text x="430.0" y="214.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">40 ≤ keys &lt; 90</text><rect x="640" y="180" width="180" height="44" rx="6" fill="#d3f1e6" stroke="#1baf7a" stroke-width="1.2"/><text x="730.0" y="198.5" text-anchor="middle" font-weight="600" fill="#0b0b0b" font-size="13">90  95  99</text><text x="730.0" y="214.5" text-anchor="middle" font-weight="400" fill="#52514e" font-size="12">keys ≥ 90</text><line x1="370" y1="100" x2="150" y2="178" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="430" y1="100" x2="430" y2="178" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="490" y1="100" x2="710" y2="178" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><line x1="220" y1="202" x2="338" y2="202" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="251.0" y="194.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">next leaf</text><line x1="520" y1="202" x2="638" y2="202" stroke="#8a8983" stroke-width="1.6" marker-end="url(#arrowhead)"/><text x="551.0" y="194.0" text-anchor="start" font-weight="400" fill="#52514e" font-size="11.5">next leaf</text><text x="438" y="146" text-anchor="start" font-weight="400" fill="#0b0b0b" font-size="12">lookup of id = 57</text><text x="20" y="262" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">Point lookup</text><text x="120" y="262" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">binary-search the root, follow one child, binary-search the leaf&#x27;s slots: O(log n) pages.</text><text x="20" y="284" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">Range scan</text><text x="120" y="284" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">descend once to the first key, then walk right along the leaf links; never back up the tree.</text><text x="20" y="306" text-anchor="start" font-weight="600" fill="#0b0b0b" font-size="13">Append</text><text x="120" y="306" text-anchor="start" font-weight="400" fill="#52514e" font-size="12.5">a full last leaf splits at the new key, not in half, so ascending inserts leave every leaf full.</text></svg>